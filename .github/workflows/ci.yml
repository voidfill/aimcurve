name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to the PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required by the master ruleset; renaming the job breaks that rule.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # curated fixtures; raw/ sweeps skip themselves without it
      - uses: pnpm/action-setup@v6 # version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
