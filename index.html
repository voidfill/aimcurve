<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width" />
		<title>aimcurve — KovaaK's run analysis</title>
		<!-- Link previews (D7 of the About design). Unfurlers run no JavaScript and
		     never see the #fragment, so every URL shares these; absolute URLs come
		     from VITE_SITE_URL (see vite.config.ts). -->
		<meta
			name="description"
			content="Free KovaaK's run analysis in your browser: see where each run gained or lost pace, which bots cost you, and how you're improving. Fully local, no account."
		/>
		<link rel="canonical" href="%VITE_SITE_URL%" />
		<meta name="theme-color" content="#5f9bd6" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="aimcurve" />
		<meta property="og:title" content="aimcurve — see where your KovaaK's runs are won and lost" />
		<meta
			property="og:description"
			content="Free KovaaK's run analysis in your browser: see where each run gained or lost pace, which bots cost you, and how you're improving. Fully local, no account."
		/>
		<meta property="og:url" content="%VITE_SITE_URL%" />
		<meta property="og:image" content="%VITE_SITE_URL%og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="aimcurve's pace chart: a KovaaK's run against its personal best over benchmark rank bands"
		/>
		<meta name="twitter:card" content="summary_large_image" />
	</head>
	<body>
		<div id="app"></div>
		<!-- Before the app, so the database worker starts fetching its wasm
		     while the app bundle is still downloading. -->
		<script type="module" src="/src/db/preload.ts"></script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
